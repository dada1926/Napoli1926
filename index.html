<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Napoli 1926 🔥</title>

<style>
body {
  margin: 0;
  font-family: Arial;
  background: linear-gradient(to right, #008CFF, #001F3F);
  color: white;
  text-align: center;
}

/* HEADER */
header {
  padding: 30px;
  font-size: 40px;
  font-weight: bold;
}

/* TEXTE QUI S'ECRIT */
#typing {
  font-size: 20px;
  margin-top: -20px;
  margin-bottom: 20px;
}

/* MENU */
nav {
  background: rgba(0,0,0,0.3);
  padding: 10px;
}
nav a {
  color: white;
  margin: 15px;
  text-decoration: none;
}
nav a:hover {
  color: yellow;
}

/* SECTIONS */
.section {
  padding: 60px;
  opacity: 0;
  transform: translateY(40px);
  transition: 1s;
}
.visible {
  opacity: 1;
  transform: translateY(0);
}

/* IMAGE */
img {
  width: 250px;
  border-radius: 10px;
  transition: 0.5s;
}
img:hover {
  transform: scale(1.1);
}

/* BALLON */
#ballon {
  position: relative;
  width: 80px;
}

/* BOUTON */
button {
  padding: 12px 20px;
  font-size: 16px;
  border: none;
  border-radius: 10px;
  background: yellow;
  cursor: pointer;
}
button:hover {
  background: orange;
}

/* QUIZ */
.quiz {
  margin-top: 20px;
}
</styl
