<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Napoli 1926</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme:light;
  --blue:#0086c3;
  --bg:#f3f8fd; --surface:#ffffff; --text:#0b1a3a; --muted:#52627f;
  --line:rgba(8,20,47,.1); --head:rgba(243,248,253,.8);
  --hero-a:#0a2a6b; --hero-b:#00aeef;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --blue:#00aeef;
    --bg:#08142f; --surface:#132047; --text:#ffffff; --muted:#a9b6d6;
    --line:rgba(255,255,255,.08); --head:rgba(8,20,47,.8);
    --hero-a:#050b1f; --hero-b:#0a3a8f;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --blue:#00aeef;
  --bg:#08142f; --surface:#132047; --text:#ffffff; --muted:#a9b6d6;
  --line:rgba(255,255,255,.08); --head:rgba(8,20,47,.8);
  --hero-a:#050b1f; --hero-b:#0a3a8f;
}
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:calc(80px + env(safe-area-inset-top,0px))}
body{font-family:"Poppins",system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--bg);color:var(--text);line-height:1.6}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--head);backdrop-filter:blur(12px);z-index:998}

/* NAV */
header{position:fixed;top:0;left:0;right:0;z-index:999;padding-top:env(safe-area-inset-top,0px);background:var(--head);backdrop-filter:blur(12px);border-bottom:1px solid transparent;transition:border-color .3s}
header.scrolled{border-color:var(--line)}
nav{max-width:1200px;margin:auto;display:flex;justify-content:space-between;align-items:center;padding:14px 24px}
.logo{font-size:1.4rem;font-weight:800;color:var(--blue);text-decoration:none;letter-spacing:-.02em}
nav ul{list-style:none;display:flex;gap:6px}
nav ul a{display:block;padding:8px 16px;border-radius:50px;color:var(--text);text-decoration:none;font-size:.95rem;font-weight:600;transition:.25s}
nav ul a:hover,nav ul a.active{background:var(--blue);color:#fff}
.burger{display:none;background:none;border:0;color:var(--text);font-size:1.7rem;cursor:pointer;line-height:1}

/* HERO */
.hero{min-height:100vh;min-height:100svh;display:flex;align-items:center;justify-content:center;text-align:center;padding:120px 24px 80px;color:#fff;position:relative;overflow:hidden;
  background:radial-gradient(circle at 20% 20%,rgba(0,174,239,.35),transparent 45%),radial-gradient(circle at 85% 80%,rgba(0,174,239,.25),transparent 40%),linear-gradient(160deg,var(--hero-a),var(--hero-b))}
.hero::after{content:"1926";position:absolute;font-weight:800;font-size:min(42vw,420px);line-height:1;color:rgba(255,255,255,.06);bottom:-6%;right:-3%;pointer-events:none}
.hero-content{max-width:760px;position:relative;z-index:1}
.badge{display:inline-block;padding:6px 16px;border:1px solid rgba(255,255,255,.35);border-radius:50px;font-size:.8rem;letter-spacing:.15em;text-transform:uppercase;margin-bottom:24px}
.hero
